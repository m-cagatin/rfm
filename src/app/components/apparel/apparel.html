<div class="container-fluid px-0">
  <!-- Carousel Wrapper -->
  <div class="carousel-wrapper">
    <div class="carousel-header">
      <h2>Choose &amp; Design your own Clothing</h2>
    </div>
    <!-- Left Arrow -->
    <button class="carousel-arrow carousel-arrow-left" 
            (click)="scrollCarousel('left')"
            [disabled]="!canScrollLeft()"
            [class.disabled]="!canScrollLeft()">
      <i class="bi bi-chevron-left"></i>
    </button>
    
    <!-- Carousel Container -->
    <div class="carousel-container" 
         #carouselContainer
         (scroll)="updateArrowStates()">
      @for (product of products(); track product.id) {
        <div class="carousel-card" (click)="viewProductDetails(product)">
          <!-- Product Image -->
          <div class="carousel-card-image" [ngClass]="product.placeholderClass">
            @if (product.imageUrl) {
              <img [src]="product.imageUrl" [alt]="product.category + ' image'">
            }
          </div>
          
          <!-- Product Info -->
          <div class="carousel-card-info">
            <h3 class="product-category">{{ product.category }}</h3>
            <p class="product-price">₱{{ product.price.toFixed(2) }}</p>
          </div>
        </div>
      }
    </div>
    
    <!-- Right Arrow -->
    <button class="carousel-arrow carousel-arrow-right" 
            (click)="scrollCarousel('right')"
            [disabled]="!canScrollRight()"
            [class.disabled]="!canScrollRight()">
      <i class="bi bi-chevron-right"></i>
    </button>
  </div>
</div>
