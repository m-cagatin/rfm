<div class="container-fluid px-0">
  <h1 class="text-center mb-5 font-bold text-4xl">Shop Our Apparel</h1>
  
  <!-- Carousel Wrapper -->
  <div class="carousel-wrapper">
    <!-- Left Arrow -->
    <button class="carousel-arrow carousel-arrow-left" 
            (click)="scrollCarousel('left')"
            [disabled]="!canScrollLeft()"
            [class.disabled]="!canScrollLeft()">
      <i class="bi bi-chevron-left"></i>
    </button>
    
    <!-- Carousel Container -->
    <div class="carousel-container" 
         #carouselContainer
         (scroll)="updateArrowStates()">
      @for (product of products(); track product.id) {
        <div class="carousel-card" (click)="viewProductDetails(product)">
          <!-- Product Image (Colored Placeholder) -->
          <div class="carousel-card-image" [class]="product.placeholderClass">
            <!-- Empty div with colored background -->
          </div>
          
          <!-- Product Info -->
          <div class="carousel-card-info">
            <h3 class="product-category">{{ product.category }}</h3>
            <p class="product-price">₱{{ product.price.toFixed(2) }}</p>
          </div>
        </div>
      }
    </div>
    
    <!-- Right Arrow -->
    <button class="carousel-arrow carousel-arrow-right" 
            (click)="scrollCarousel('right')"
            [disabled]="!canScrollRight()"
            [class.disabled]="!canScrollRight()">
      <i class="bi bi-chevron-right"></i>
    </button>
  </div>
</div>
